# Configurações da aplicação Security Demo - Java 21

# ===== CONFIGURAÇÕES DO SERVIDOR =====
server.port=8080
server.servlet.context-path=/

# ===== CONFIGURAÇÕES DO BANCO H2 =====
spring.datasource.url=jdbc:h2:mem:security_demo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== CONFIGURAÇÕES DO H2 CONSOLE =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== CONFIGURAÇÕES JPA/HIBERNATE =====
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect # Removido - detectado automaticamente no Spring Boot 3.x
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== CONFIGURAÇÕES JWT =====
# Secret seguro para JWT (em produção, usar variável de ambiente)
jwt.secret=security_demo_jwt_secret_key_32_chars_minimum_required_for_security_java21
jwt.expiration=3600000

# ===== CONFIGURAÇÕES DE LOGGING =====
# Níveis de log
logging.level.root=INFO
logging.level.com.demo.security=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logs específicos para auditoria
logging.level.SECURITY_AUDIT=INFO
logging.level.JWT_AUDIT=INFO
logging.level.DATA_ACCESS_AUDIT=INFO
logging.level.SECURITY_ALERT=WARN

# ===== CONFIGURAÇÕES DE VALIDAÇÃO =====
spring.validation.enabled=true

# ===== CONFIGURAÇÕES DE SEGURANÇA =====
# Headers de segurança (mesmo vulneráveis para demonstração)
spring.security.headers.frame=SAMEORIGIN

# ===== CONFIGURAÇÕES ESPECÍFICAS JAVA 21 =====
# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# ===== CONFIGURAÇÕES LOG4J PARA DEMONSTRAÇÃO LOG4SHELL =====
# ⚠️  ATENÇÃO: CONFIGURAÇÕES VULNERÁVEIS PARA FINS EDUCATIVOS ⚠️
# Habilita lookup JNDI (VULNERÁVEL!)
log4j2.formatMsgNoLookups=false
# Permite acesso remoto JNDI (VULNERÁVEL!)
log4j2.enableJndiLookup=true
# Configurações de sistema para demonstração
logging.pattern.console=%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
logging.level.com.demo.security=DEBUG
logging.level.org.apache.logging.log4j=DEBUG

# ===== CONFIGURAÇÕES DE PERFORMANCE =====
# Pool de conexões
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ===== CONFIGURAÇÕES DE DEMONSTRAÇÃO =====
# Configurações específicas para o projeto educativo
app.security.demo.enabled=true
app.security.demo.vulnerability.sql-injection=true
app.security.demo.vulnerability.pii-logs=true
app.security.demo.vulnerability.jwt=true
app.security.demo.vulnerability.data-exposure=true

# ===== MENSAGENS DE CONFIGURAÇÃO =====
# Personalizações de mensagens de erro
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false